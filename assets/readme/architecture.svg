<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
<title id="title">从分享链接到本地归档</title><desc id="desc">四个阶段：解析输入、提取内容、校验文件、结构化归档。</desc>
<rect width="1200" height="365" fill="#eeeae1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="42" y="49" font-family="ui-monospace,monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#ec512f">THE WORKFLOW</text>
<text x="42" y="91" font-size="31" font-weight="800" fill="#151513">从分享链接，到本地归档<tspan fill="#f0522d">.</tspan></text>
<text x="1158" y="86" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" fill="#888177">01 — 04</text>
<path d="M42 111H1158" stroke="#cfc8bc"/>
<g transform="translate(42 138)"><rect width="264" height="178" rx="3" fill="#fffefa"/><text x="18" y="32" font-family="monospace" font-size="13" fill="#ec512f">01 / PARSE</text><text x="18" y="72" font-size="22" font-weight="800" fill="#171715">解析输入</text><text x="18" y="105" font-size="15" fill="#716c63">提取链接、口令和标识符</text><text x="18" y="151" font-family="monospace" font-size="12" fill="#969086">URL / DOI / ISBN / MD5</text></g>
<g transform="translate(326 138)"><rect width="264" height="178" rx="3" fill="#fffefa"/><text x="18" y="32" font-family="monospace" font-size="13" fill="#ec512f">02 / EXTRACT</text><text x="18" y="72" font-size="22" font-weight="800" fill="#171715">提取内容</text><text x="18" y="105" font-size="15" fill="#716c63">匹配来源，下载文件与附件</text><text x="18" y="151" font-family="monospace" font-size="12" fill="#969086">VIDEO / AUDIO / DOCS</text></g>
<g transform="translate(610 138)"><rect width="264" height="178" rx="3" fill="#fffefa"/><text x="18" y="32" font-family="monospace" font-size="13" fill="#ec512f">03 / VERIFY</text><text x="18" y="72" font-size="22" font-weight="800" fill="#171715">校验文件</text><text x="18" y="105" font-size="15" fill="#716c63">检查格式，并限制解压边界</text><text x="18" y="151" font-family="monospace" font-size="12" fill="#969086">MEDIA / PDF / ARCHIVE</text></g>
<g transform="translate(894 138)"><rect width="264" height="178" rx="3" fill="#1c1c1a"/><text x="18" y="32" font-family="monospace" font-size="13" fill="#f17b5e">04 / ARCHIVE</text><text x="18" y="72" font-size="22" font-weight="800" fill="#f8f5ee">结构化归档</text><text x="18" y="105" font-size="15" fill="#c4bfb5">整理附件，按需同步知识库</text><text x="18" y="151" font-family="monospace" font-size="12" fill="#99958c">JSON / MD / SRT / BIB</text></g>
</g></svg>
