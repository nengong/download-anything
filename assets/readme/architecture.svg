<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Download Anything 工作流与架构流水线</title>
  <desc id="desc">展示从脏链接净化与智能路由、按内容类型提取、安全边界与格式级校验，到本地伴生元数据及 Markdown 与 Obsidian/Notion 归档的完整四步流程。</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="430" rx="24" fill="url(#arch-bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="54" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700">四步闭环：从杂乱分享文本到可验证的本地资产</text>
  <text x="1152" y="54" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">PIPELINE  ·  CLEAN → ROUTE → VERIFY → DELIVER</text>

  <!-- Connecting Arrows Between 4 Stages (pure lines + polygons for universal SVG compatibility) -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none">
    <line x1="292" y1="226" x2="318" y2="226"/>
    <line x1="582" y1="226" x2="608" y2="226"/>
    <line x1="872" y1="226" x2="898" y2="226"/>
  </g>
  <g fill="#38BDF8">
    <polygon points="316,219 328,226 316,233"/>
    <polygon points="606,219 618,226 606,233"/>
    <polygon points="896,219 908,226 896,233"/>
  </g>

  <!-- Stage 1: Input Purification -->
  <g transform="translate(42 84)">
    <rect x="0" y="0" width="248" height="296" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#38BDF8"/>
    <text x="20" y="40" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">01 / CLEAN &amp; PARSE</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">智能输入净化</text>

    <rect x="18" y="94" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="122" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">剥离口令广告与表情</text>

    <rect x="18" y="148" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="176" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">自动识别内嵌提取码</text>

    <rect x="18" y="202" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="230" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">支持 DOI / ISBN / MD5</text>

    <text x="20" y="274" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">core/router.py</text>
  </g>

  <!-- Stage 2: On-Demand Driver Dispatch -->
  <g transform="translate(332 84)">
    <rect x="0" y="0" width="248" height="296" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#A78BFA"/>
    <text x="20" y="40" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">02 / EXTRACT</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">多源按需路由</text>

    <rect x="18" y="94" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="122" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">视频 / 多图 / 播客 / 音频</text>

    <rect x="18" y="148" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="176" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">公众号 / 技术文 / 网盘</text>

    <rect x="18" y="202" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="230" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">论文 / 电子书 / 安装包</text>

    <text x="20" y="274" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">drivers/* (on-demand)</text>
  </g>

  <!-- Stage 3: Safety & Format Verification -->
  <g transform="translate(622 84)">
    <rect x="0" y="0" width="248" height="296" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#F59E0B"/>
    <text x="20" y="40" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">03 / GUARD &amp; VERIFY</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">安全边界与格式验收</text>

    <rect x="18" y="94" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="122" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">单文件默认 ≤ 500 MB</text>

    <rect x="18" y="148" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="176" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">PDF / 图像 / 音视频校验</text>

    <rect x="18" y="202" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="230" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">受限解压防路径穿越</text>

    <text x="20" y="274" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">verifier.py + unpacker.py</text>
  </g>

  <!-- Stage 4: Local Archive & Knowledge Sync -->
  <g transform="translate(912 84)">
    <rect x="0" y="0" width="248" height="296" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#10B981"/>
    <text x="20" y="40" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">04 / ARCHIVE &amp; SYNC</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">伴生归档与知识同步</text>

    <rect x="18" y="94" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="122" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">Markdown / 字幕 / 歌词</text>

    <rect x="18" y="148" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="176" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">Obsidian / Notion / 转写</text>

    <rect x="18" y="202" width="212" height="44" rx="8" fill="#1E293B"/>
    <text x="30" y="230" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">SQLite 缓存与 JSON 报告</text>

    <text x="20" y="274" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">sidecar.py + vault_sync.py</text>
  </g>
</svg>
